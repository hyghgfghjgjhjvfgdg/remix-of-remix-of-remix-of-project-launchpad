plugins { id 'com.android.application' }

android {
    namespace 'com.moviemax.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.moviemax.app'
        minSdk 24
        targetSdk 34
        // Bump both for every release, and the same numbers in the website's public/app-version.json.
        versionCode 4
        versionName '1.0.3'
        // Used until the app has read the active website from Firebase once.
        buildConfigField 'String', 'DEFAULT_SITE', '"https://luofilm.site"'
        buildConfigField 'String', 'ACTIVE_SITE_DOC', '"https://firestore.googleapis.com/v1/projects/luo-film-2026/databases/(default)/documents/app_settings/active_site?key=AIzaSyBTSFk7GSITIHQ9WxSdi1BoVvcr4FXuZe0"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file('moviemax.keystore')
            storePassword 'moviemax2026'
            keyAlias 'moviemax'
            keyPassword 'moviemax2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
